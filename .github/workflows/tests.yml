# Vérifie que le moteur d'alignement et le reste tiennent, à chaque envoi.
#
# Le banc de mesure est lancé en plus des tests : un test qui passe ne prouve
# rien si son seuil est complaisant, et c'est le banc qui dit de combien.

name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Qualité de l'alignement
        run: npm run bench
      - name: Recherche du point de rupture
        run: node test/stress.js
